syntax = "proto3";

package avlp.vector.v1;

option go_package = "github.com/vectorial-dua/avlp/gen/avlp/vector/v1;vectorv1";

import "student_state.proto";
import "interactive_node.proto";

// VectorRouter is the adaptive routing API consumed by Agent/IDE/Master.
service VectorRouter {
  rpc QueryNearestNode(VectorQuery) returns (RouteResult);
  rpc GetInteractiveNode(NodeIdRequest) returns (InteractiveVideoNode);
  rpc MutateInteractiveNode(MutateInteractiveRequest) returns (MutateInteractiveResponse);
  rpc RecordSubtopicInteraction(SubtopicInteraction) returns (Ack);
  // GetSubtopicProgress trusts the client-declared student_id, same as the
  // Record* RPCs. A multi-user deployment needs authentication and per-student
  // authorization (tracked as Ola 4 debt).
  rpc GetSubtopicProgress(SubtopicProgressQuery) returns (SubtopicProgress);
  // Accepts botonera_schema variants and legacy flat Botonera id_btn matches.
  // Legacy vector_delta is content-embedding space and is NEVER applied to V_e;
  // without a client preference_delta the RPC returns Ack without Apply.
  rpc RecordBotoneraInteraction(BotoneraInteraction) returns (Ack);
  // Poll a pending live station by tracking_ulid (student_id required for ownership check).
  rpc GetLiveStation(LiveStationQuery) returns (LiveStationStatus);
}

message NodeResponse {
  string node_id = 1;
  string dimension_dua = 2;
  string resource_url = 3;
  float similarity_score = 4;
  bool is_live_generated = 5;
  repeated string retrieved_sources = 6;
  string live_content = 7;
  // When the matched pedagogical node is interactive, Master may fetch full payload via GetInteractiveNode.
  bool has_interactive_payload = 8;
}

message LiveStationPending {
  string tracking_ulid = 1;
  string status = 2; // "in_progress" | "failed"
  // Student-facing rogerian message (Spanish); not a technical diagnostic.
  string message = 3;
}

message LiveStationQuery {
  string tracking_ulid = 1;
  string student_id = 2;
}

message LiveStationStatus {
  string tracking_ulid = 1;
  string status = 2; // in_progress | ready | failed
  string student_message = 3;
  string node_id = 4;
  string live_content = 5;
  repeated string retrieved_sources = 6;
}

message SubtopicProgressQuery {
  string student_id = 1;
  string parent_node_id = 2;
}

message RootSubtopicProgress {
  string subtopic_id = 1;
  string title = 2;
  string state = 3; // "visited" | "partial" | "unvisited"
}

message SubtopicProgress {
  string student_id = 1;
  string parent_node_id = 2;
  repeated string opened_subtopic_ids = 3;
  int32 total_subtopics = 4;
  repeated RootSubtopicProgress root_states = 5;
}

message RouteResult {
  oneof outcome {
    NodeResponse matched = 1;
    LiveStationPending pending = 2;
  }
}
