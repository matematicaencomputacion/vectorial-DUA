<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AVLP Master — prototipo (placeholder)</title>
  <style>
    :root {
      --bg: #1a1f24;
      --fg: #e8eef2;
      --muted: #9aa8b3;
      --accent: #3d8bfd;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #243040, var(--bg));
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      line-height: 1.5;
    }
    h1 { font-weight: 600; font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: var(--muted); margin: 0 0 0.75rem; }
    code {
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>AVLP Master — placeholder</h1>
    <p>
      Gateway HTTP/JSON activo. El Stage + botonera del contrato llega en el PR 6.2
      (<code>web/index.html</code> completo).
    </p>
    <p>API: <code>POST /api/query</code>, <code>GET /api/nodes/{id}</code>, estaciones y mutaciones.</p>
  </main>
</body>
</html>
